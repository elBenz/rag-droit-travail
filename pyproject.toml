[project]
name = "rag-droit-travail"
version = "0.1.0"
description = "Prototype RAG sur les fiches Service-Public du droit du travail"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langchain-text-splitters>=1.2.0",
    "langchain-voyageai>=0.4.1",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
